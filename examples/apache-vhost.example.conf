<VirtualHost *:80>
    ServerName finance.example.com
    DocumentRoot /opt/firefly/public

    <Directory /opt/firefly/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/firefly-error.log
    CustomLog ${APACHE_LOG_DIR}/firefly-access.log combined
</VirtualHost>
